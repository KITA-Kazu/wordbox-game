<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORDBOX 語彙レベルチェック＆サバイバル</title>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .container { background: var(--card-bg); width: 100%; max-width: 500px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 24px; position: relative; overflow: hidden; }
    .hidden { display: none !important; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .badge { background: #e0e7ff; color: #4338ca; font-weight: bold; padding: 8px 18px; border-radius: 20px; font-size: 1.3rem; }
    .timer { font-size: 1.5rem; font-weight: 800; color: var(--danger); font-variant-numeric: tabular-nums; }
    
    .status-bar { display: flex; gap: 8px; margin-bottom: 16px; }
    .stat-box { flex: 1; background: #f9fafb; border: 1px solid #e5e7eb; padding: 8px; border-radius: 8px; text-align: center; }
    .stat-label { font-size: 0.75rem; color: #6b7280; }
    .stat-value { font-size: 1.4rem; font-weight: bold; }
    
    .streak-dots { display: flex; gap: 6px; justify-content: center; margin-top: 4px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #e5e7eb; transition: background 0.2s; }
    .dot.active-up { background: var(--success); }
    .dot.active-down { background: var(--danger); }

    .word-card { text-align: center; padding: 20px 0; border-bottom: 2px solid #f3f4f6; margin-bottom: 20px; }
    .word-title { font-size: 2.2rem; font-weight: 800; color: #111827; }
    
    .options-grid { display: grid; gap: 10px; }
    .btn-opt { background: #ffffff; border: 2px solid #e5e7eb; border-radius: 10px; padding: 14px; font-size: 1rem; text-align: left; cursor: pointer; transition: all 0.15s ease; width: 100%; color: var(--text); font-weight: 600; }
    .btn-opt:hover { background: #f9fafb; border-color: var(--primary); }
    .btn-opt:active { transform: scale(0.98); }
    
    .btn-primary { background: var(--primary); color: white; border: none; padding: 14px 28px; font-size: 1.1rem; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; transition: background 0.2s; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: #6b7280; color: white; border: none; padding: 14px 28px; font-size: 1rem; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 10px; }

    .result-screen { text-align: center; padding: 10px 0; }
    .result-level { font-size: 3rem; font-weight: 900; color: var(--primary); margin: 10px 0; }
    .perfect-title { font-size: 1.6rem; color: var(--success); font-weight: bold; margin-bottom: 12px; }
  </style>
</head>
<body>

<div class="container">
  <div id="screen-start">
    <h1 style="text-align: center; margin-bottom: 10px; font-size: 1.8rem;">WORDBOX<br>語彙レベルチェッカー</h1>
    <p style="text-align: center; color: #6b7280; font-size: 0.95rem; margin-bottom: 20px;">
      制限時間 90秒！<br>
      ・5問連続正解 ➔ <b>Level UP</b><br>
      ・3問連続不正解 ➔ <b>Level DOWN</b>
    </p>
    <button class="btn-primary" onclick="startGame()">テストスタート！</button>
  </div>

  <div id="screen-play" class="hidden">
    <div class="header">
      <span class="badge" id="lbl-level">Level 1</span>
      <span class="timer" id="lbl-timer">90</span>
    </div>

    <div class="status-bar">
      <div class="stat-box">
        <div class="stat-label">最高達成</div>
        <div class="stat-value" id="lbl-max-level">Level 1</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">連続正解 (昇格)</div>
        <div class="streak-dots" id="dots-up">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
      </div>
      <div class="stat-box">
        <div class="stat-label">連続不正解 (降格)</div>
        <div class="streak-dots" id="dots-down">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
      </div>
    </div>

    <div class="word-card">
      <div class="word-title" id="lbl-word">word</div>
    </div>

    <div class="options-grid" id="options-container"></div>
  </div>

  <div id="screen-result" class="hidden result-screen">
    <div id="result-normal">
      <h2>タイムアップ！</h2>
      <p style="margin-top: 10px; color: #6b7280;">あなたの到達語彙レベル</p>
      <div class="result-level" id="lbl-final-level">Level 1</div>
      <p id="lbl-level-name" style="font-weight: bold; color: #374151; margin-bottom: 20px;"></p>
    </div>

    <div id="result-perfect" class="hidden">
      <div class="perfect-title">🏆 完全制覇！ 🏆</div>
      <p style="font-size: 1.2rem; font-weight: bold; margin: 20px 0; color: #1f2937;">
        あなたにはもう単語テストは必要ありません！
      </p>
    </div>

    <button class="btn-primary" onclick="startGame()">もう一度挑戦する</button>
    <button class="btn-secondary hidden" id="btn-review" onclick="startReview()">間違えた問題を復習する (<span id="review-count">0</span>)</button>
  </div>
</div>

};

let usedWords = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: [], 8: [] };

function nextQuestion() {
  updateHeaderUI();
  
  const pool = wordData[currentLevel];
  
  // 未出題単語の抽出（重複防止）
  let unusedPool = pool.filter(item => !usedWords[currentLevel].includes(item.w));
  if (unusedPool.length === 0) {
    usedWords[currentLevel] = [];
    unusedPool = pool;
  }
  
  const target = unusedPool[Math.floor(Math.random() * unusedPool.length)];
  usedWords[currentLevel].push(target.w);
  
  let allDistractors = [];
  Object.keys(wordData).forEach(lvl => {
    wordData[lvl].forEach(item => {
      if (item.m !== target.m) allDistractors.push(item.m);
    });
  });
  
  allDistractors.sort(() => Math.random() - 0.5);
  const selectedDistractors = allDistractors.slice(0, 3);
  
  const options = [target.m, ...selectedDistractors].sort(() => Math.random() - 0.5);

  currentQuestion = { word: target.w, correctMeaning: target.m, level: currentLevel };

  document.getElementById('lbl-word').innerText = target.w;
  const container = document.getElementById('options-container');
  container.innerHTML = '';

  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'btn-opt';
    btn.innerText = opt;
    btn.onclick = () => handleAnswer(opt === target.m);
    container.appendChild(btn);
  });
}

const levelNames = {
  1: "Essential STAGE 0 (中学・超基礎)",
  2: "Essential STAGE 1 (高校基礎)",
  3: "Essential STAGE 2 (共通テスト基礎)",
  4: "Essential STAGE 3 (共通テスト標準)",
  5: "Advanced STAGE 1 (中堅私大・共通発展)",
  6: "Advanced STAGE 2 (国公立・難関私大)",
  7: "Advanced STAGE 3 (難関国公立・早慶)",
  8: "Advanced STAGE 4 (最難関)"
};

let currentLevel = 1;
let maxLevelAchieved = 1;
let streakUp = 0;
let streakDown = 0;
let timeLeft = 90;
let timerId = null;
let currentQuestion = null;
let wrongQuestions = [];
let isReviewMode = false;

const screenStart = document.getElementById('screen-start');
const screenPlay = document.getElementById('screen-play');
const screenResult = document.getElementById('screen-result');

function startGame() {
  currentLevel = 1;
  maxLevelAchieved = 1;
  streakUp = 0;
  streakDown = 0;
  timeLeft = 90;
  wrongQuestions = [];
  usedWords = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: [], 8: [] };
  isReviewMode = false;

  screenStart.classList.add('hidden');
  screenResult.classList.add('hidden');
  screenPlay.classList.remove('hidden');

  updateHeaderUI();
  nextQuestion();

  clearInterval(timerId);
  timerId = setInterval(() => {
    timeLeft--;
    document.getElementById('lbl-timer').innerText = timeLeft;
    if (timeLeft <= 0) {
      endGame(false);
    }
  }, 1000);
}
function updateHeaderUI() {
  document.getElementById('lbl-level').innerText = `Level ${currentLevel}`;
  document.getElementById('lbl-max-level').innerText = `Level ${maxLevelAchieved}`;
  
  const dotsUp = document.getElementById('dots-up').children;
  for (let i = 0; i < 5; i++) {
    dotsUp[i].className = i < streakUp ? 'dot active-up' : 'dot';
  }
  
  const dotsDown = document.getElementById('dots-down').children;
  for (let i = 0; i < 3; i++) {
    dotsDown[i].className = i < streakDown ? 'dot active-down' : 'dot';
  }
}

function nextQuestion() {
  updateHeaderUI();
  
  const pool = wordData[currentLevel];
  const target = pool[Math.floor(Math.random() * pool.length)];
  
  let allDistractors = [];
  Object.keys(wordData).forEach(lvl => {
    wordData[lvl].forEach(item => {
      if (item.m !== target.m) allDistractors.push(item.m);
    });
  });
  
  allDistractors.sort(() => Math.random() - 0.5);
  const selectedDistractors = allDistractors.slice(0, 3);
  
  const options = [target.m, ...selectedDistractors].sort(() => Math.random() - 0.5);

  currentQuestion = { word: target.w, correctMeaning: target.m, level: currentLevel };

  document.getElementById('lbl-word').innerText = target.w;
  const container = document.getElementById('options-container');
  container.innerHTML = '';

  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'btn-opt';
    btn.innerText = opt;
    btn.onclick = () => handleAnswer(opt === target.m);
    container.appendChild(btn);
  });
}

function handleAnswer(isCorrect) {
  if (isCorrect) {
    streakUp++;
    streakDown = 0;

    if (streakUp >= 5) {
      if (currentLevel < 8) {
        currentLevel++;
        if (currentLevel > maxLevelAchieved) maxLevelAchieved = currentLevel;
        streakUp = 0;
      } else {
        endGame(true);
        return;
      }
    }
  } else {
    if (!wrongQuestions.some(q => q.word === currentQuestion.word)) {
      wrongQuestions.push(currentQuestion);
    }

    streakDown++;
    streakUp = 0;

    // ★修正箇所：Level 8の場合は1問ミスで即降格、それ以外は3連ミスで降格
    if (currentLevel === 8) {
      currentLevel = 7; // 即座にLevel 7へ降格
      streakDown = 0;
    } else if (streakDown >= 3) {
      if (currentLevel > 1) {
        currentLevel--;
      }
      streakDown = 0;
    }
  }

  nextQuestion();
}

function endGame(isPerfect) {
  clearInterval(timerId);
  screenPlay.classList.add('hidden');
  screenResult.classList.remove('hidden');

  const resultNormal = document.getElementById('result-normal');
  const resultPerfect = document.getElementById('result-perfect');
  const btnReview = document.getElementById('btn-review');

  if (isPerfect) {
    resultNormal.classList.add('hidden');
    resultPerfect.classList.remove('hidden');
  } else {
    resultNormal.classList.remove('hidden');
    resultPerfect.classList.add('hidden');
    document.getElementById('lbl-final-level').innerText = `Level ${maxLevelAchieved}`;
    document.getElementById('lbl-level-name').innerText = levelNames[maxLevelAchieved];
  }

  if (wrongQuestions.length > 0) {
    btnReview.classList.remove('hidden');
    document.getElementById('review-count').innerText = wrongQuestions.length;
  } else {
    btnReview.classList.add('hidden');
  }
}

function startReview() {
  isReviewMode = true;
  screenResult.classList.add('hidden');
  screenPlay.classList.remove('hidden');
  
  document.getElementById('lbl-timer').innerText = "復習";
  nextReviewQuestion();
}

function nextReviewQuestion() {
  if (wrongQuestions.length === 0) {
    alert("すべての間違えた問題を克服しました！");
    screenPlay.classList.add('hidden');
    screenResult.classList.remove('hidden');
    document.getElementById('btn-review').classList.add('hidden');
    return;
  }

  const target = wrongQuestions[0];
  document.getElementById('lbl-level').innerText = `ミス復習 (残り ${wrongQuestions.length}問)`;
  
  let distractors = [];
  Object.keys(wordData).forEach(lvl => {
    wordData[lvl].forEach(item => {
      if (item.m !== target.correctMeaning) distractors.push(item.m);
    });
  });
  distractors.sort(() => Math.random() - 0.5);
  const options = [target.correctMeaning, ...distractors.slice(0, 3)].sort(() => Math.random() - 0.5);

  document.getElementById('lbl-word').innerText = target.word;
  const container = document.getElementById('options-container');
  container.innerHTML = '';

  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'btn-opt';
    btn.innerText = opt;
    btn.onclick = () => {
      if (opt === target.correctMeaning) {
        wrongQuestions.shift();
      } else {
        wrongQuestions.push(wrongQuestions.shift());
      }
      nextReviewQuestion();
    };
    container.appendChild(btn);
  });
}
</script>
